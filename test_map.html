<!DOCTYPE html>
<html>
<head>
    <title>Test Mapa</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { 
            height: 400px; 
            width: 100%; 
            border: 2px solid red;
        }
    </style>
</head>
<body>
    <h1>Test de Mapa Leaflet</h1>
    <div id="map"></div>
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        console.log('Leaflet cargado:', typeof L);
        
        var map = L.map('map').setView([19.4326, -99.1332], 13);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);
        
        var marker = L.marker([19.4326, -99.1332]).addTo(map);
        marker.bindPopup('Ciudad de México').openPopup();
        
        console.log('Mapa inicializado');
    </script>
</body>
</html>
